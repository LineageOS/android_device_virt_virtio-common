insmod reboot
insmod serial
insmod smbios

menuentry "Install @BOOTMGR_ANDROID_DISTRIBUTION_NAME@${kernel_version_display_mainmenu} on phone" --class cellphone-arrow-down {
	boot_android_install androidboot.selinux=permissive virtio_gpu.force_resolution=576x1024
}

smbios --get-string=04 --set smbios_manufacturer

if [ "$smbios_manufacturer" != "QEMU" ]; then
	if [ "$smbios_manufacturer" != "SeaBIOS" ]; then
		echo "ERROR: Unsupported machine. Rebooting in 5 seconds."
		sleep 5
		reboot
	fi
fi

serial
terminal_output --append serial
