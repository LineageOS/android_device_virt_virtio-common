insmod serial

submenu 'Advanced options' --class format-list-bulleted --id advancedoptions-virtio_common {
	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Swiftshader graphics)" --id android-virtio_common-swiftshader {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-swiftshader"
		boot_android androidboot.graphics=swiftshader
	}

	menuentry "Boot GSI from /dev/block/sda with @BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display}" --id android-virtio_common-gsifromsda {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-gsifromsda"
		boot_android androidboot.fstab_suffix=virtio.gsi.sda
	}

	menuentry "Boot GSI from /dev/block/vdc with @BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display}" --id android-virtio_common-gsifromvdc {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-gsifromvdc"
		boot_android androidboot.fstab_suffix=virtio.gsi.vdc
	}
}

serial
terminal_output --append serial
