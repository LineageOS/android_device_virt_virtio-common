insmod serial

submenu 'Advanced options' --class format-list-bulleted --id advancedoptions-virtio_common {
#SUPPORT_MESA_SWRAST#	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Headless mode, Mesa swrast graphics)" --id android-virtio_common-headless_mesaswrast {
#SUPPORT_MESA_SWRAST#		set_android_default "advancedoptions-virtio_common>android-virtio_common-headless_mesaswrast"
#SUPPORT_MESA_SWRAST#		boot_android virtio_gpu.modeset=0 androidboot.gpu=vkms androidboot.graphics=mesa_swrast androidboot.insecure_adb=1
#SUPPORT_MESA_SWRAST#	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Headless mode, Swiftshader graphics)" --id android-virtio_common-headless_swiftshader {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-headless_swiftshader"
		boot_android virtio_gpu.modeset=0 androidboot.gpu=vkms androidboot.graphics=swiftshader androidboot.insecure_adb=1
	}

#SUPPORT_MESA_SWRAST#	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Mesa swrast graphics)" --id android-virtio_common-mesaswrast {
#SUPPORT_MESA_SWRAST#		set_android_default "advancedoptions-virtio_common>android-virtio_common-mesaswrast"
#SUPPORT_MESA_SWRAST#		boot_android androidboot.graphics=mesa_swrast
#SUPPORT_MESA_SWRAST#	}

	menuentry "@BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display} (Swiftshader graphics)" --id android-virtio_common-swiftshader {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-swiftshader"
		boot_android androidboot.graphics=swiftshader
	}

	menuentry "Boot GSI from /dev/block/sda with @BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display}" --id android-virtio_common-gsifromsda {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-gsifromsda"
		boot_android androidboot.fstab_suffix=virtio.gsi.sda
	}

	menuentry "Boot GSI from /dev/block/vdc with @BOOTMGR_ANDROID_DISTRIBUTION_NAME@ ${kernel_version_display}" --id android-virtio_common-gsifromvdc {
		set_android_default "advancedoptions-virtio_common>android-virtio_common-gsifromvdc"
		boot_android androidboot.fstab_suffix=virtio.gsi.vdc
	}
}

serial
terminal_output --append serial
