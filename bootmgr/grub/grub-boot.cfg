insmod serial

function set_kernel_cmdline_dynamic_device_specific {
	load_env -f ${partition_persist}/grubenv serial_console_function

	set kernel_cmdline_dynamic_device_specific=

	if [ "$serial_console_function" = "console" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.console=@LINUX_SERIAL_DEVICE@"
	elif [ "$serial_console_function" = "console_in_ramdisk" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.first_stage_console=1 console=@LINUX_SERIAL_DEVICE@"
	elif [ "$serial_console_function" = "dmesg" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} console=@LINUX_SERIAL_DEVICE@"
	elif [ "$serial_console_function" = "logcat" ]; then
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.seriallogging=@LINUX_SERIAL_DEVICE@"
	else
		set kernel_cmdline_dynamic_device_specific="${kernel_cmdline_dynamic_device_specific} androidboot.console=hvc0 androidboot.seriallogging=hvc1 console=@LINUX_SERIAL_DEVICE@"
	fi
}

